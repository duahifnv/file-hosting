spring:
  application:
    name: ${app.name} - ${app.version}

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

app:
  name: "@project.name@"
  version: "@project.version@"

server:
  error:
    include-message: always

jwt:
  public-secret-key: ${JWT_SECRET:QTE/eGAaVqV9dvnmTIjlvz07JyBBMB4dDaR9sp9T/OA=}
  token-lifetime: 86400s # 24 часа

minio:
  endpoint-uri: http://${MINIO_HOST}:${MINIO_PORT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  init-bucket-name: ${MINIO_INIT_BUCKET}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /api-docs

file:
  lifetime: 30m

logging:
  level:
    root: INFO
    org.duahifnv.filehosting: DEBUG
    org.duahifnv.jwtauthstarter: DEBUG
    org.duahifnv.errorwebhandlerstarter: DEBUG
